<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Chat - Markdown Mode Mock</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --color-sage: #8b9467;
      --color-sage-light: rgba(139, 148, 103, 0.1);
      --color-sage-lighter: rgba(139, 148, 103, 0.05);
      --color-sage-border: rgba(139, 148, 103, 0.2);
      --color-sage-border-light: rgba(139, 148, 103, 0.08);
      --color-bg: #f5f1eb;
      --color-card: rgba(254, 254, 254, 0.95);
      --color-white: #ffffff;
      --color-text-primary: #1a1a1a;
      --color-text-secondary: #666666;
      --color-text-muted: #999999;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--color-bg);
      min-height: 100vh;
    }

    /* Full Page Layout - matches AgentChatPage.tsx */
    .agent-chat-page {
      display: flex;
      height: 100vh;
      background: var(--color-bg);
    }

    /* Sidebar */
    .agent-chat-sidebar {
      width: 280px;
      background: var(--color-white);
      border-right: 1px solid var(--color-sage-border-light);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .agent-chat-sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--color-sage-border-light);
    }

    .agent-chat-avatar {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--color-sage-light);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .agent-chat-sidebar-actions {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .agent-sidebar-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: var(--color-sage-lighter);
      color: var(--color-text-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .agent-sidebar-btn:hover {
      background: var(--color-sage-light);
      color: var(--color-text-primary);
    }

    .agent-sidebar-btn.primary {
      background: var(--color-sage);
      color: white;
    }

    .agent-sidebar-btn.primary:hover {
      background: #7a8359;
    }

    /* Main Chat Area */
    .agent-chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .agent-chat-messages-full {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .agent-chat-empty-full {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .agent-chat-empty-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: var(--color-sage-lighter);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Messages */
    .agent-message-full {
      display: flex;
      flex-direction: column;
      max-width: 100%;
    }

    .agent-message-full.user { align-items: flex-end; }
    .agent-message-full.assistant { align-items: flex-start; }

    .message-bubble-full {
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.6;
      max-width: 80%;
      position: relative;
    }

    .message-bubble-full.user {
      background: var(--color-sage);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message-bubble-full.assistant {
      background: var(--color-white);
      border: 1px solid var(--color-sage-border-light);
      border-bottom-left-radius: 4px;
      color: var(--color-text-primary);
    }

    /* ======================= */
    /* INPUT AREA - KEY CHANGE */
    /* ======================= */
    .agent-chat-input-full {
      padding: 24px 32px;
      background: var(--color-white);
      border-top: 1px solid var(--color-sage-border-light);
    }

    .agent-chat-input-form {
      display: flex;
      flex-direction: column;
      gap: 0;
      max-width: 900px;
      margin: 0 auto;
    }

    /* NEW: Mode Toggle Wrapper */
    .input-mode-wrapper {
      display: flex;
      flex-direction: column;
      position: relative;
      margin-top: 32px;
    }

    /* NEW: Markdown Toggle Tab - sits ON TOP */
    .markdown-toggle-btn {
      position: absolute;
      top: -28px;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border: 1px solid var(--color-sage-border);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      background: var(--color-white);
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .markdown-toggle-btn:hover {
      color: var(--color-sage);
      background: var(--color-sage-lighter);
    }

    .markdown-toggle-btn.active {
      color: var(--color-sage);
      background: var(--color-sage-light);
      border-color: var(--color-sage);
    }

    .markdown-toggle-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Input Container with light green contour when active */
    .input-container {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: var(--color-white);
      border: 1px solid var(--color-sage-border-light);
      border-radius: 12px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input-container.markdown-active {
      border-color: var(--color-sage);
      box-shadow: 0 0 0 3px var(--color-sage-light);
    }

    .input-field-wrapper {
      flex: 1;
      position: relative;
    }

    /* Normal Input (existing) */
    .agent-chat-input-field {
      width: 100%;
      height: 48px;
      background: var(--color-bg);
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      font-size: 15px;
      color: var(--color-text-primary);
      outline: none;
    }

    .agent-chat-input-field::placeholder {
      color: var(--color-text-muted);
    }

    /* NEW: Markdown Textarea */
    .agent-chat-textarea-field {
      width: 100%;
      min-height: 100px;
      max-height: 200px;
      background: var(--color-bg);
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 15px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      color: var(--color-text-primary);
      outline: none;
      resize: none;
      line-height: 1.5;
    }

    .agent-chat-textarea-field::placeholder {
      color: var(--color-text-muted);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* Send Button (existing) */
    .agent-chat-send-btn {
      width: 48px;
      height: 48px;
      background: var(--color-sage);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
      align-self: flex-end;
    }

    .agent-chat-send-btn:hover:not(:disabled) {
      background: #7a8359;
    }

    .agent-chat-send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* NEW: Input Helper Text */
    .input-helper {
      padding: 8px 12px 0;
      font-size: 11px;
      color: var(--color-text-muted);
    }

    .input-helper kbd {
      background: var(--color-sage-lighter);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 10px;
    }

    /* Utility */
    .flex { display: flex; }
    .items-center { align-items: center; }
    .gap-3 { gap: 12px; }
    .text-lg { font-size: 18px; }
    .text-xs { font-size: 11px; }
    .font-semibold { font-weight: 600; }
  </style>
</head>
<body>
  <div class="agent-chat-page">
    <!-- Sidebar (unchanged from AgentChatPage.tsx) -->
    <aside class="agent-chat-sidebar">
      <div class="agent-chat-sidebar-header">
        <div class="flex items-center gap-3">
          <div class="agent-chat-avatar">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8b9467" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
              <line x1="9" y1="9" x2="9.01" y2="9"/>
              <line x1="15" y1="9" x2="15.01" y2="9"/>
            </svg>
          </div>
          <div>
            <h2 class="text-lg font-semibold" style="color: var(--color-text-primary)">Sensei</h2>
            <p class="text-xs" style="color: var(--color-text-muted)">AI Assistant</p>
          </div>
        </div>
      </div>

      <div class="agent-chat-sidebar-actions">
        <button class="agent-sidebar-btn primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          New Chat
        </button>
        <button class="agent-sidebar-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          History
        </button>
        <button class="agent-sidebar-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Back
        </button>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="agent-chat-main">
      <div class="agent-chat-messages-full">
        <!-- Sample messages -->
        <div class="agent-message-full assistant">
          <div class="message-bubble-full assistant">
            <p>Hello! I'm your AI assistant. How can I help you today?</p>
          </div>
        </div>

        <div class="agent-message-full user">
          <div class="message-bubble-full user">
            <p>Can you help me implement a new feature?</p>
          </div>
        </div>

        <div class="agent-message-full assistant">
          <div class="message-bubble-full assistant">
            <p>Of course! Please describe the feature you'd like to implement and I'll help you plan it out.</p>
          </div>
        </div>
      </div>

      <!-- Input Area - WITH MARKDOWN MODE -->
      <div class="agent-chat-input-full">
        <form class="agent-chat-input-form" id="chatForm">
          <div class="input-mode-wrapper">
            <!-- Markdown Toggle Tab - ON TOP of input -->
            <button type="button" class="markdown-toggle-btn" id="markdownToggle" onclick="toggleMarkdownMode()">
              <svg viewBox="0 0 208 128" fill="currentColor">
                <rect width="198" height="118" x="5" y="5" rx="10" fill="none" stroke="currentColor" stroke-width="10"/>
                <path d="M30 98V30h20l20 25 20-25h20v68H90V59L70 84 50 59v39zm125 0-30-33h20V30h20v35h20z"/>
              </svg>
              Markdown
            </button>

            <!-- Input Container with light green contour -->
            <div class="input-container" id="inputContainer">
              <div class="input-field-wrapper" id="inputWrapper">
                <!-- Default: single-line input -->
                <input
                  type="text"
                  id="chatInput"
                  class="agent-chat-input-field"
                  placeholder="Type your message..."
                  onkeydown="handleKeyDown(event)"
                >
              </div>
              <button type="submit" class="agent-chat-send-btn" id="sendBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <line x1="22" y1="2" x2="11" y2="13"/>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
              </button>
            </div>

            <!-- Helper text -->
            <div class="input-helper" id="inputHelper">
              Press <kbd>Enter</kbd> to send
            </div>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script>
    let isMarkdownMode = false;

    function toggleMarkdownMode() {
      const toggleBtn = document.getElementById('markdownToggle');
      const inputContainer = document.getElementById('inputContainer');
      const inputWrapper = document.getElementById('inputWrapper');
      const inputHelper = document.getElementById('inputHelper');

      isMarkdownMode = !isMarkdownMode;

      if (isMarkdownMode) {
        toggleBtn.classList.add('active');
        inputContainer.classList.add('markdown-active');

        // Switch to textarea
        const currentValue = inputWrapper.querySelector('input, textarea')?.value || '';
        inputWrapper.innerHTML = `
          <textarea
            id="markdownInput"
            class="agent-chat-textarea-field"
            placeholder="Write your prompt...&#10;&#10;Use markdown formatting&#10;Enter creates new lines"
          >${currentValue}</textarea>
        `;
        inputHelper.innerHTML = '<kbd>Enter</kbd> = new line &nbsp;|&nbsp; Click <strong>Send</strong> to submit';

        document.getElementById('markdownInput').focus();
      } else {
        toggleBtn.classList.remove('active');
        inputContainer.classList.remove('markdown-active');

        // Switch to input
        const currentValue = inputWrapper.querySelector('input, textarea')?.value || '';
        const singleLine = currentValue.replace(/\n/g, ' ').trim();
        inputWrapper.innerHTML = `
          <input
            type="text"
            id="chatInput"
            class="agent-chat-input-field"
            placeholder="Type your message..."
            value="${singleLine}"
            onkeydown="handleKeyDown(event)"
          >
        `;
        inputHelper.innerHTML = 'Press <kbd>Enter</kbd> to send';

        document.getElementById('chatInput').focus();
      }
    }

    function handleKeyDown(event) {
      // Only submit on Enter in chat mode
      if (event.key === 'Enter' && !isMarkdownMode) {
        event.preventDefault();
        handleSubmit();
      }
    }

    function handleSubmit() {
      const input = document.querySelector('#inputWrapper input, #inputWrapper textarea');
      const value = input?.value.trim();
      if (!value) return;

      alert(`Message sent (${isMarkdownMode ? 'Markdown' : 'Chat'} mode):\n\n${value}`);
      input.value = '';
    }

    document.getElementById('chatForm').addEventListener('submit', function(e) {
      e.preventDefault();
      handleSubmit();
    });
  </script>
</body>
</html>
