  <title>Kaizen OS - Guided Weekly Planning</title>

  <!-- react-big-calendar CSS -->

  <!-- Import map for ESM modules -->

    "imports": {

  <style>
    :root {
      --color-sage: #8B9467;
      --color-sage-light: rgba(139, 148, 103, 0.1);
      --color-sage-border: rgba(139, 148, 103, 0.2);

      --color-card: rgba(254, 254, 254, 0.95);

<style>
    /* Header */
    header {
      padding: 12px 24px;
      border-bottom: 1px solid var(--color-sage-border-light);
      background: var(--color-card);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left { display: flex; align-items: center; gap: 20px; }
    .logo { font-size: 20px; font-weight: 600; color: var(--color-sage); }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--color-text-muted);
    }
    .breadcrumb a { color: var(--color-text-secondary); text-decoration: none; }
    .breadcrumb span { color: var(--color-text-primary); font-weight: 500; }

    .header-right { display: flex; align-items: center; gap: 12px; }

    .btn-secondary {
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid var(--color-sage-border);
      background: var(--color-white);
      color: var(--color-text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: var(--color-sage-light);
      border-color: var(--color-sage);
      color: var(--color-sage);
    }

    .btn-primary {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--color-sage), #7a8359);
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(139, 148, 103, 0.3);
    }
</style>

<style>
    /* Main Layout - Two Column */
    .main-container {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      padding: 24px;
      max-width: 1600px;
      margin: 0 auto;
      min-height: calc(100vh - 60px);
    }

    /* Action Panel (Left) */
    .action-panel {
      background: var(--color-card);
      border: 1px solid var(--color-sage-border-light);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .progress-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--color-sage-border-light);
      background: linear-gradient(135deg, var(--color-sage-light), transparent);
    }

    .progress-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-sage);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .progress-bar-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      background: var(--color-sage-border);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--color-sage);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-primary);
      min-width: 50px;
      text-align: right;
    }

    /* Action Card */
    .action-card-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .action-card {
      background: var(--color-white);
      border: 2px solid var(--color-sage);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .action-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .action-type-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .action-type-badge.gate { background: rgba(231, 76, 60, 0.1); color: var(--color-red); }
    .action-type-badge.experiment { background: rgba(155, 89, 182, 0.1); color: var(--color-purple); }
    .action-type-badge.routine { background: rgba(26, 188, 156, 0.1); color: var(--color-teal); }
    .action-type-badge.ops { background: rgba(243, 156, 18, 0.1); color: var(--color-orange); }

    .theme-badge {
      font-size: 11px;
      color: var(--color-text-muted);
      background: var(--color-sage-light);
      padding: 4px 8px;
      border-radius: 4px;
    }

    .action-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 8px;
    }

    .action-description {
      font-size: 13px;
      color: var(--color-text-secondary);
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .action-meta {
      display: flex;
      gap: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--color-sage-border-light);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--color-text-muted);
    }

    .meta-item svg { opacity: 0.6; }
</style>

<style>

    .nav-btn {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;

      font-weight: 500;

      align-items: center;
      justify-content: center;

    }

    .nav-btn.skip {

      color: var(--color-orange);
    }

    .nav-btn.skip:hover {
      background: rgba(243, 156, 18, 0.15);
    }

    .nav-btn.next {
      border: none;

      color: white;
    }

    }

    .nav-btn:disabled {

</style>

    .type-dot.gate { background: var(--color-red); }

    /* Calendar Panel (Right) */

<script type="module">
import React, { useState, useCallback } from 'react';
import { createRoot } from 'react-dom/client';
import { Calendar, dateFnsLocalizer, Views } from 'react-big-calendar';
import { format, parse, startOfWeek, getDay, addDays } from 'date-fns';

const { createElement: h, Fragment } = React;

// Setup localizer
const localizer = dateFnsLocalizer({
  format, parse,
  startOfWeek: (date) => startOfWeek(date, { weekStartsOn: 1 }),
  getDay,
  locales: { 'en-US': undefined },
});

const today = new Date();
const weekStartDate = startOfWeek(today, { weekStartsOn: 1 });

// Sample actions data
const actions = [
  { id: 1, title: 'Ship MVP Landing Page', type: 'gate', theme: 'Career Growth', description: 'Complete the landing page with hero, features, and CTA sections. Deadline: Friday.', deadline: 'Jan 3', status: 'pending' },
  { id: 2, title: 'Morning Meditation', type: 'routine', theme: 'Health & Wellness', description: 'Daily 15-min meditation practice. Target: 5x this week.', frequency: '5x/week', status: 'pending' },
  { id: 3, title: 'Try Pomodoro Technique', type: 'experiment', theme: 'Productivity', description: 'Test 25/5 pomodoro cycles for deep work. Track focus quality.', duration: '2 weeks', status: 'pending' },
  { id: 4, title: 'Grocery Shopping', type: 'ops', theme: 'Life Admin', description: 'Weekly grocery run. Meal prep for the week.', status: 'pending' },
  { id: 5, title: 'Finish API Integration', type: 'gate', theme: 'Career Growth', description: 'Complete backend API integration for user auth flow.', deadline: 'Jan 2', status: 'pending' },
  { id: 6, title: 'Evening Walk', type: 'routine', theme: 'Health & Wellness', description: '30-min walk after dinner. Target: 4x this week.', frequency: '4x/week', status: 'pending' },
];

// Existing calendar events (gcal)
const gcalEvents = [
  { id: 'g1', title: 'Team Standup', start: new Date(addDays(weekStartDate, 0).setHours(9, 0)), end: new Date(addDays(weekStartDate, 0).setHours(9, 30)), source: 'gcal' },
  { id: 'g2', title: 'Dentist Appt', start: new Date(addDays(weekStartDate, 2).setHours(14, 0)), end: new Date(addDays(weekStartDate, 2).setHours(15, 0)), source: 'gcal' },
  { id: 'g3', title: 'Team Lunch', start: new Date(addDays(weekStartDate, 4).setHours(12, 0)), end: new Date(addDays(weekStartDate, 4).setHours(13, 0)), source: 'gcal' },
];

function App() {
  const [currentIndex, setCurrentIndex] = useState(0);
  const [actionStates, setActionStates] = useState(actions.map(() => ({ status: 'pending', tasks: [] })));
  const [allEvents, setAllEvents] = useState(gcalEvents);

  const currentAction = actions[currentIndex];
  const currentState = actionStates[currentIndex];
  const completedCount = actionStates.filter(s => s.status === 'completed' || s.status === 'skipped').length;
  const progress = Math.round((completedCount / actions.length) * 100);

  const handleNext = () => {
    const newStates = [...actionStates];
    if (currentState.tasks.length > 0) {
      newStates[currentIndex] = { ...currentState, status: 'completed' };
    }
    setActionStates(newStates);
    if (currentIndex < actions.length - 1) setCurrentIndex(currentIndex + 1);
  };

  const handleSkip = () => {
    const newStates = [...actionStates];
    newStates[currentIndex] = { ...currentState, status: 'skipped' };
    setActionStates(newStates);
    if (currentIndex < actions.length - 1) setCurrentIndex(currentIndex + 1);
  };

  const handlePrev = () => {
    if (currentIndex > 0) setCurrentIndex(currentIndex - 1);
  };

  const handleSelectAction = (index) => {
    setCurrentIndex(index);
  };

  const handleSelectSlot = useCallback(({ start, end }) => {
    const title = currentAction.title;
    const newEvent = {
      id: `new-${Date.now()}`,
      title,
      start,
      end,
      source: 'current',
      actionId: currentAction.id,
    };
    setAllEvents(prev => [...prev, newEvent]);
    const newStates = [...actionStates];
    newStates[currentIndex] = {
      ...currentState,
      tasks: [...currentState.tasks, { id: newEvent.id, start, end, title }]
    };
    setActionStates(newStates);
  }, [currentAction, currentIndex, actionStates, currentState]);

  const handleRemoveTask = (taskId) => {
    setAllEvents(prev => prev.filter(e => e.id !== taskId));
    const newStates = [...actionStates];
    newStates[currentIndex] = {
      ...currentState,
      tasks: currentState.tasks.filter(t => t.id !== taskId)
    };
    setActionStates(newStates);
  };

  const eventStyleGetter = (event) => {
    if (event.source === 'gcal') return { className: 'event-gcal' };
    if (event.source === 'current') return { className: 'event-current' };
    return { className: 'event-planned' };
  };

  return h(Fragment, null,
    h('header', null,
      h('div', { className: 'header-left' },
        h('div', { className: 'logo' }, 'Kaizen'),
        h('div', { className: 'breadcrumb' },
          h('a', { href: '#' }, 'Calendar'),
          h('span', null, '/'),
          h('span', null, 'Guided Planning')
        )
      ),
      h('div', { className: 'header-right' },
        h('button', { className: 'btn-secondary' }, 'Cancel'),
        h('button', { className: 'btn-primary' },
          h('svg', { width: 16, height: 16, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
            h('path', { d: 'M12 5v14M5 12h14' })
          ),
          'Push to Calendar'
        )
      )
    ),
    h('main', { className: 'main-container' },

<script type="module">

import React, { useState, useCallback } from 'react';
import { createRoot } from 'react-dom/client';
import { Calendar, dateFnsLocalizer, Views } from 'react-big-calendar';
import { format, parse, startOfWeek, getDay, addDays } from 'date-fns';

const { createElement: h, Fragment } = React;

const localizer = dateFnsLocalizer({
  format, parse,
  startOfWeek: (date) => startOfWeek(date, { weekStartsOn: 1 }),
  getDay,
  locales: { 'en-US': undefined },
});

const today = new Date();
const weekStartDate = startOfWeek(today, { weekStartsOn: 1 });

const actions = [
  { id: 1, title: 'Ship MVP Landing Page', type: 'gate', theme: 'Career Growth', description: 'Complete the landing page with hero, features, and CTA sections. Deadline: Friday.', deadline: 'Jan 3' },
  { id: 2, title: 'Morning Meditation', type: 'routine', theme: 'Health & Wellness', description: 'Daily 15-min meditation practice. Target: 5x this week.', frequency: '5x/week' },
  { id: 3, title: 'Try Pomodoro Technique', type: 'experiment', theme: 'Productivity', description: 'Test 25/5 pomodoro cycles for deep work. Track focus quality.', duration: '2 weeks' },
  { id: 4, title: 'Grocery Shopping', type: 'ops', theme: 'Life Admin', description: 'Weekly grocery run. Meal prep for the week.' },
  { id: 5, title: 'Finish API Integration', type: 'gate', theme: 'Career Growth', description: 'Complete backend API integration for user auth flow.', deadline: 'Jan 2' },
  { id: 6, title: 'Evening Walk', type: 'routine', theme: 'Health & Wellness', description: '30-min walk after dinner. Target: 4x this week.', frequency: '4x/week' },
];

const gcalEvents = [
  { id: 'g1', title: 'Team Standup', start: new Date(addDays(weekStartDate, 0).setHours(9, 0)), end: new Date(addDays(weekStartDate, 0).setHours(9, 30)), source: 'gcal' },
  { id: 'g2', title: 'Dentist Appt', start: new Date(addDays(weekStartDate, 2).setHours(14, 0)), end: new Date(addDays(weekStartDate, 2).setHours(15, 0)), source: 'gcal' },
  { id: 'g3', title: 'Team Lunch', start: new Date(addDays(weekStartDate, 4).setHours(12, 0)), end: new Date(addDays(weekStartDate, 4).setHours(13, 0)), source: 'gcal' },
];

const typeLabels = { gate: 'Gate', experiment: 'Experiment', routine: 'Routine', ops: 'Ops' };

function formatTime(date) { return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }); }
function formatDay(date) { return date.toLocaleDateString('en-US', { weekday: 'short' }); }

function App() {
  const [currentIndex, setCurrentIndex] = useState(0);
  const [actionStates, setActionStates] = useState(actions.map(() => ({ status: 'pending', tasks: [] })));
  const [allEvents, setAllEvents] = useState(gcalEvents);

  const currentAction = actions[currentIndex];
  const currentState = actionStates[currentIndex];
  const completedCount = actionStates.filter(s => s.status === 'completed' || s.status === 'skipped').length;
  const progress = Math.round((completedCount / actions.length) * 100);

  const handleNext = () => {
    const newStates = [...actionStates];
    if (currentState.tasks.length > 0) newStates[currentIndex] = { ...currentState, status: 'completed' };
    setActionStates(newStates);
    if (currentIndex < actions.length - 1) setCurrentIndex(currentIndex + 1);
  };

  const handleSkip = () => {
    const newStates = [...actionStates];
    newStates[currentIndex] = { ...currentState, status: 'skipped' };
    setActionStates(newStates);
    if (currentIndex < actions.length - 1) setCurrentIndex(currentIndex + 1);
  };

  const handlePrev = () => { if (currentIndex > 0) setCurrentIndex(currentIndex - 1); };
  const handleSelectAction = (index) => { setCurrentIndex(index); };

  const handleSelectSlot = useCallback(({ start, end }) => {
    const newEvent = { id: `new-${Date.now()}`, title: currentAction.title, start, end, source: 'current', actionId: currentAction.id };
    setAllEvents(prev => [...prev, newEvent]);
    const newStates = [...actionStates];
    newStates[currentIndex] = { ...currentState, tasks: [...currentState.tasks, { id: newEvent.id, start, end, title: currentAction.title }] };
    setActionStates(newStates);
  }, [currentAction, currentIndex, actionStates, currentState]);

  const handleRemoveTask = (taskId) => {
    setAllEvents(prev => prev.filter(e => e.id !== taskId));
    const newStates = [...actionStates];
    newStates[currentIndex] = { ...currentState, tasks: currentState.tasks.filter(t => t.id !== taskId) };
    setActionStates(newStates);
  };

  const eventStyleGetter = (event) => {
    if (event.source === 'gcal') return { className: 'event-gcal' };
    if (event.source === 'current') return { className: 'event-current' };
    return { className: 'event-planned' };
  };

  return h(Fragment, null,
    h('header', null,
      h('div', { className: 'header-left' },
        h('div', { className: 'logo' }, 'Kaizen'),
        h('div', { className: 'breadcrumb' }, h('a', { href: '#' }, 'Calendar'), h('span', null, '/'), h('span', null, 'Guided Planning'))
      ),
      h('div', { className: 'header-right' },
        h('button', { className: 'btn-secondary' }, 'Cancel'),
        h('button', { className: 'btn-primary' }, h('svg', { width: 16, height: 16, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 }, h('path', { d: 'M12 5v14M5 12h14' })), 'Push to Calendar')
      )
    ),
    h('main', { className: 'main-container' },
      // Action Panel
      h('div', { className: 'action-panel' },
        h('div', { className: 'progress-header' },
          h('div', { className: 'progress-title' }, 'Guided Planning'),
          h('div', { className: 'progress-bar-container' },
            h('div', { className: 'progress-bar' }, h('div', { className: 'progress-bar-fill', style: { width: `${progress}%` } })),
            h('div', { className: 'progress-text' }, `${currentIndex + 1}/${actions.length}`)
          )
        ),
        h('div', { className: 'action-card-container' },
          h('div', { className: 'action-card' },
            h('div', { className: 'action-card-header' },
              h('div', { className: `action-type-badge ${currentAction.type}` }, typeLabels[currentAction.type]),
              h('div', { className: 'theme-badge' }, currentAction.theme)
            ),
            h('div', { className: 'action-title' }, currentAction.title),
            h('div', { className: 'action-description' }, currentAction.description),
            h('div', { className: 'action-meta' },
              currentAction.deadline && h('div', { className: 'meta-item' }, `📅 Due: ${currentAction.deadline}`),
              currentAction.frequency && h('div', { className: 'meta-item' }, `🔄 ${currentAction.frequency}`)
            ),
            h('div', { className: 'planned-tasks' },
              h('div', { className: 'planned-tasks-title' }, `Planned this week (${currentState.tasks.length})`),
              currentState.tasks.length === 0
                ? h('div', { className: 'empty-planned' }, 'Click on calendar to add time blocks')
                : currentState.tasks.map(task => h('div', { key: task.id, className: 'planned-task-item' },
                    h('span', { className: 'time' }, formatTime(task.start)),
                    h('span', { className: 'title' }, formatDay(task.start)),
                    h('button', { className: 'remove-btn', onClick: () => handleRemoveTask(task.id) }, '×')
                  ))
            )
          ),
          h('div', { className: 'action-list' },
            h('div', { className: 'action-list-title' }, 'All Actions'),
            actions.map((action, idx) => h('div', {
              key: action.id,
              className: `action-list-item ${idx === currentIndex ? 'active' : ''} ${actionStates[idx].status}`,
              onClick: () => handleSelectAction(idx)
            },
              h('div', { className: 'status-icon' }, actionStates[idx].status === 'completed' ? '✓' : actionStates[idx].status === 'skipped' ? '–' : ''),
              h('span', { className: 'name' }, action.title),
              h('div', { className: `type-dot ${action.type}` })
            ))
          )
        ),
        h('div', { className: 'action-nav' },
          h('button', { className: 'nav-btn prev', onClick: handlePrev, disabled: currentIndex === 0 }, '← Prev'),
          h('button', { className: 'nav-btn skip', onClick: handleSkip }, 'Skip'),
          h('button', { className: 'nav-btn next', onClick: handleNext }, currentIndex === actions.length - 1 ? 'Finish' : 'Next →')
        )
      ),
      // Calendar Panel
      h('div', { className: 'calendar-panel' },
        h('div', { className: 'calendar-toolbar' },
          h('div', { className: 'legend' },
            h('div', { className: 'legend-item' }, h('div', { className: 'legend-dot gcal' }), 'Google Calendar'),
            h('div', { className: 'legend-item' }, h('div', { className: 'legend-dot current' }), 'Current Action'),
            h('div', { className: 'legend-item' }, h('div', { className: 'legend-dot planned' }), 'Other Planned')
          ),
          h('div', { className: 'calendar-hint' }, `Click to add: ${currentAction.title}`)
        ),
        h('div', { className: 'calendar-container' },
          h(Calendar, {
            localizer,
            events: allEvents,
            defaultView: Views.WEEK,
            views: ['week', 'day'],
            defaultDate: weekStartDate,
            eventPropGetter: eventStyleGetter,
            onSelectSlot: handleSelectSlot,
            selectable: true,

            step: 30,
            timeslots: 2,
            style: { height: 600 },
          })
        )
      )
    )
  );
