<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amex Offers Helper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>Amex Offers</h1>
      <div class="row">
        <label for="delay">Delay (ms)</label>
        <input id="delay" type="number" min="0" step="50" value="300" />
      </div>

      <div class="actions">
        <button id="scan">Scan + Click All</button>
        <button id="exportJson">Export JSON</button>
        <button id="exportCsv">Export CSV</button>
        <button id="clear" class="danger">Clear Saved</button>
      </div>

      <div id="status" class="status">Ready.</div>
      <div class="counts">
        Saved offers: <span id="savedCount">0</span>
      </div>

      <details class="help">
        <summary>Help</summary>
        <ul>
          <li>Open the Amex Offers page or the provided sample.html.</li>
          <li>If using sample.html, enable “Allow access to file URLs” in Chrome’s extension settings.</li>
          <li>Click “Scan + Click All” to collect offers.</li>
          <li>Use Export JSON/CSV to download your data.</li>
        </ul>
      </details>
    </div>
    <script src="popup.js"></script>
  </body>
  </html>
